project_id = "brand_your_mac"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "30MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/sell", "http://localhost:3000/sell", "http://127.0.0.1:3000/manage", "http://localhost:3000/manage"]
enable_signup = true

# Uncomment for local X OAuth after adding the matching values to an uncommitted .env file.
# [auth.external.x]
# enabled = true
# client_id = "env(X_OAUTH_CLIENT_ID)"
# secret = "env(X_OAUTH_CLIENT_SECRET)"
# redirect_uri = ""

[edge_runtime]
enabled = false

[analytics]
enabled = false
